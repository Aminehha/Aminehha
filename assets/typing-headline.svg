<svg xmlns="http://www.w3.org/2000/svg" width="640" height="74" viewBox="0 0 640 74" role="img" aria-labelledby="title description">
  <title id="title">Full-stack Developer · Open to collaboration</title>
  <desc id="description">A slow typing headline alternating between Full-stack Developer and Open to collaboration. Reduced-motion viewers see a static developer title.</desc>
  <defs>
    <clipPath id="first"><rect class="reveal-one" x="128" y="16" width="384" height="42"/></clipPath>
    <clipPath id="second"><rect class="reveal-two" x="118.4" y="16" width="0" height="42"/></clipPath>
    <linearGradient id="edge" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#4f8cff" stop-opacity=".45"/>
      <stop offset="1" stop-color="#a78bfa" stop-opacity=".45"/>
    </linearGradient>
  </defs>
  <style>
    .reveal-one { animation: type-one 12s steps(20,end) infinite; }
    .reveal-two { animation: type-two 12s steps(21,end) infinite; }
    .caret-one { animation: caret-one 12s steps(20,end) infinite; }
    .caret-two { animation: caret-two 12s steps(21,end) infinite; }
    @keyframes type-one {
      0% { width: 0px; }
      16%,39% { width: 384px; }
      47%,100% { width: 0px; }
    }
    @keyframes type-two {
      0%,50% { width: 0px; }
      67%,90% { width: 403.2px; }
      98%,100% { width: 0px; }
    }
    @keyframes caret-one {
      0% { x: 128px; opacity: .85; }
      16%,39% { x: 514px; opacity: .85; }
      47% { x: 128px; opacity: .85; }
      48%,100% { x: 128px; opacity: 0; }
    }
    @keyframes caret-two {
      0%,49% { x: 118.4px; opacity: 0; }
      50% { x: 118.4px; opacity: .85; }
      67%,90% { x: 523.6px; opacity: .85; }
      98% { x: 118.4px; opacity: .85; }
      99%,100% { x: 118.4px; opacity: 0; }
    }
    @media (prefers-reduced-motion: reduce) {
      .reveal-one { animation: none; width: 384px; }
      .reveal-two { animation: none; width: 0px; }
      .caret-one,.caret-two { display: none; animation: none; }
    }
  </style>
  <rect x=".5" y=".5" width="639" height="73" rx="18" fill="#0b1020" stroke="url(#edge)"/>
  <g fill="#e5eeff" font-family="SFMono-Regular, Consolas, Liberation Mono, monospace" font-size="32" font-weight="500">
    <g clip-path="url(#first)"><text x="128" y="47" textLength="384" lengthAdjust="spacingAndGlyphs">Full-stack Developer</text></g>
    <g clip-path="url(#second)"><text x="118.4" y="47" textLength="403.2" lengthAdjust="spacingAndGlyphs">Open to collaboration</text></g>
  </g>
  <rect class="caret-one" x="128" y="22" width="2" height="31" rx="1" fill="#a78bfa"/>
  <rect class="caret-two" x="118.4" y="22" width="2" height="31" rx="1" fill="#79a8ff" opacity="0"/>
</svg>
