<svg xmlns="http://www.w3.org/2000/svg" width="960" height="240" viewBox="0 0 960 240" role="img" aria-labelledby="title description">
  <title id="title">amindev — Aurora</title>
  <desc id="description">A navy banner with softly moving blue and violet ribbons. Motion stops when reduced motion is preferred.</desc>
  <defs>
    <clipPath id="frame"><rect width="960" height="240" rx="28"/></clipPath>
    <linearGradient id="edge" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#4f8cff" stop-opacity=".75"/>
      <stop offset=".55" stop-color="#a78bfa" stop-opacity=".55"/>
      <stop offset="1" stop-color="#4f8cff" stop-opacity=".2"/>
    </linearGradient>
    <linearGradient id="blue" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#4f8cff" stop-opacity="0"/>
      <stop offset=".5" stop-color="#4f8cff" stop-opacity=".5"/>
      <stop offset="1" stop-color="#a78bfa" stop-opacity=".18"/>
    </linearGradient>
    <linearGradient id="violet" x1="0" y1="1" x2="1" y2="0">
      <stop offset="0" stop-color="#a78bfa" stop-opacity=".46"/>
      <stop offset=".6" stop-color="#7c3aed" stop-opacity=".15"/>
      <stop offset="1" stop-color="#4f8cff" stop-opacity="0"/>
    </linearGradient>
    <radialGradient id="halo">
      <stop offset="0" stop-color="#6757bf" stop-opacity=".27"/>
      <stop offset="1" stop-color="#0b1020" stop-opacity="0"/>
    </radialGradient>
    <pattern id="dots" width="32" height="32" patternUnits="userSpaceOnUse">
      <circle cx="16" cy="16" r=".8" fill="#b6c8ef" opacity=".14"/>
    </pattern>
  </defs>
  <style>
    .ribbon-a { animation: drift-a 18s ease-in-out infinite; }
    .ribbon-b { animation: drift-b 22s ease-in-out infinite; }
    @keyframes drift-a {
      0%,100% { transform: translate(-10px, 2px); }
      50% { transform: translate(14px, -8px); }
    }
    @keyframes drift-b {
      0%,100% { transform: translate(8px, -2px); }
      50% { transform: translate(-12px, 7px); }
    }
    @media (prefers-reduced-motion: reduce) {
      .ribbon-a,.ribbon-b { animation: none; }
    }
  </style>
  <g clip-path="url(#frame)">
    <rect width="960" height="240" fill="#0b1020"/>
    <rect width="960" height="240" fill="url(#dots)"/>
    <ellipse cx="480" cy="122" rx="380" ry="145" fill="url(#halo)"/>
    <g class="ribbon-a">
      <path d="M-80 232 C155 26 290 296 552 78 S870 8 1030 126 L1050 244 H-80Z" fill="url(#blue)"/>
      <path d="M-70 216 C163 48 322 269 555 87 S866 39 1020 112" fill="none" stroke="#79a8ff" stroke-width="1" opacity=".25"/>
    </g>
    <g class="ribbon-b">
      <path d="M-80 28 C123 171 262 -46 471 71 S770 241 1030 9 L1050 -24 H-80Z" fill="url(#violet)"/>
      <path d="M-40 42 C153 170 284 -10 487 89 S785 217 1010 31" fill="none" stroke="#c2a9ff" stroke-width="1" opacity=".23"/>
    </g>
    <text x="480" y="148" text-anchor="middle" fill="#f4f7ff" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="92" font-weight="750" letter-spacing="-4">amindev</text>
    <rect x="430" y="179" width="100" height="3" rx="1.5" fill="url(#edge)" opacity=".8"/>
  </g>
  <rect x=".75" y=".75" width="958.5" height="238.5" rx="27.25" fill="none" stroke="url(#edge)" stroke-width="1.5"/>
</svg>
